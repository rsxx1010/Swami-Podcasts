services:
  - type: web
    name: swami-podcasts-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_ASSISTANT_NAME
        value: swami-podcasts
      - key: PINECONE_MODEL
        value: gpt-5
      - key: ALLOWED_ORIGINS
        sync: false
